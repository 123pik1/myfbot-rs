[package]
name = "myfbot-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
poise = "0.7.1"
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serenity = "0.12.5"

[dependencies.tokio]
version = "1.54.1"
features = ["macros", "rt-multi-thread"]
